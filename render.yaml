services:
  - type: web
    name: dannikov-kanban-api
    runtime: node
    plan: free
    region: frankfurt
    branch: feat/backend
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://dannikov-react-kanban.netlify.app
